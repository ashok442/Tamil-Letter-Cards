name: Build Tamil Letter Cards APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TamilLetterCards_AndroidStudio_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract app project
        run: |
          mkdir appsrc
          unzip TamilLetterCards_AndroidStudio_Project.zip -d appsrc

      - name: Set Java and Kotlin targets to 17
        working-directory: appsrc
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s += '''

          // Keep Java and Kotlin bytecode targets consistent for CI builds.
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          '''
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: appsrc
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TamilLetterCards-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
